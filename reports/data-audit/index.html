<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>只读数据质量审阅</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;background:#111827;color:#e5e7eb;font:14px/1.45 system-ui,sans-serif}header{padding:12px 18px;background:#1f2937;position:sticky;top:0;z-index:3}h1{font-size:18px;margin:0 0 6px}button,select{font:inherit;padding:5px 10px;margin-right:6px}label{margin-right:14px}main{padding:12px;display:grid;gap:12px}.sheet{grid-template-columns:repeat(4,minmax(0,1fr))}.pair{grid-template-columns:repeat(2,minmax(0,1fr))}.empty{grid-template-columns:repeat(2,minmax(0,1fr))}article{background:#1f2937;border:1px solid #4b5563;padding:7px;min-width:0}.caption{overflow-wrap:anywhere;font-size:12px}.stage{position:relative;margin-top:5px;width:100%}.stage img{display:block;width:100%;height:auto}.stage svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px;margin:5px 0}#status{font-size:12px;color:#a7f3d0}body.raw svg{display:none}body.zoom main{grid-template-columns:1fr;max-width:1000px;margin:auto}.details{font-size:12px;color:#cbd5e1}
.sheet{grid-template-columns:repeat(2,minmax(0,1fr))}.context{grid-template-columns:repeat(3,minmax(0,1fr))}.caption{font-size:11px}
</style></head><body><header><h1>本地只读审阅：重复图片 → 空标签</h1><button id="sheet1">重复图1–8</button><button id="sheet2">重复图9–16</button><label>并排组<select id="pair"></select></label><button id="empties">空标签</button><label><input id="boxes" type="checkbox" checked>显示原标签框</label><label><input id="zoom" type="checkbox">单列放大</label><div id="status">正在加载本批manifest，无网络上传</div></header><main id="main"></main><script>
'use strict';const main=document.querySelector('#main'),status=document.querySelector('#status');let groups=[],emptyRows=[],currentMode='sheet',currentIndex=0;const names=['truck','car','van','bus'],colors=['#ff595e','#8ac926','#ffca3a','#1982ff'];const base='../../multi-vehicle_kaggle_competition_starter_kit_files/data/';
function originalId(r){return r.relative.split(/[\\/]/).pop().split('_jpg.rf.')[0]}
function url(r){return base+r.relative.replaceAll('\\','/').split('/').map(encodeURIComponent).join('/')}
async function card(r,title,hash){const a=document.createElement('article'),caption=document.createElement('div');caption.className='caption';caption.textContent=title+' | '+originalId(r);a.append(caption);const d=document.createElement('div');d.className='stage';const im=document.createElement('img');im.src=url(r);im.alt=title+' '+originalId(r);d.append(im);const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 640 640');d.append(svg);a.append(d);const lab={relative:r.relative.replace(/([\\/])images([\\/])/,'$1labels$2').replace(/\.[^.]+$/,'.txt')};const text=await fetch(url(lab)).then(x=>{if(!x.ok)throw Error('Label fetch '+x.status);return x.text()});const lines=text.trim()?text.trim().split(/\r?\n/):[];for(const line of lines){const [c,x,y,w,h]=line.trim().split(/\s+/).map(Number);const rect=document.createElementNS(svg.namespaceURI,'rect');rect.setAttribute('x',(x-w/2)*640);rect.setAttribute('y',(y-h/2)*640);rect.setAttribute('width',w*640);rect.setAttribute('height',h*640);rect.setAttribute('fill','none');rect.setAttribute('stroke',colors[c]||'white');rect.setAttribute('stroke-width','1.5');svg.append(rect);const tx=document.createElementNS(svg.namespaceURI,'text');tx.setAttribute('x',(x-w/2)*640);tx.setAttribute('y',Math.max(10,(y-h/2)*640));tx.setAttribute('font-size','10');tx.setAttribute('fill',colors[c]||'white');tx.textContent=names[c];svg.append(tx)}const p=document.createElement('div');p.className='details';p.textContent='原标签框数：'+lines.length+' | '+r.bytes+'字节 | '+r.relative;a.append(p);if(hash){const h=document.createElement('div');h.className='details';h.textContent='SHA256 '+hash;a.append(h)}return a}
async function show(mode,index=0){currentMode=mode;currentIndex=index;main.replaceChildren();main.className=mode;let items=[];if(mode==='sheet'){items=groups.slice(index,index+8).map((g,i)=>({r:g.train[0],title:'配对'+String(index+i+1).padStart(2,'0')+' train代表图（两侧完整字节hash相同）',hash:g.hash}))}else if(mode==='pair'){const g=groups[index];items=[...g.train.map(r=>({r,title:'配对'+(index+1)+' TRAIN',hash:g.hash})),...g.val.map(r=>({r,title:'配对'+(index+1)+' VAL',hash:g.hash}))]}else{items=emptyRows.map((r,i)=>({r,title:'空标签'+(i+1)+' '+r.relative.split(/[\\/]/)[0],hash:r.sha256}))}for(const item of items)main.append(await card(item.r,item.title,item.hash));await Promise.all([...main.querySelectorAll('img')].map(im=>im.complete?Promise.resolve():new Promise((res,rej)=>{im.onload=res;im.onerror=()=>rej(Error('Image load failed'))})));status.textContent='已加载 '+items.length+'张 | 跨组同hash内容 '+groups.length+'组 | 空标签 '+emptyRows.length+'张 | 仅本地读取';window.auditReady=true;window.auditState={mode,index,images:items.length}}
async function init(){const rows=await fetch('../data_manifest.json').then(r=>r.json());const m=new Map();for(const r of rows){if(/[\\/]images[\\/]/.test(r.relative)){if(!m.has(r.sha256))m.set(r.sha256,{hash:r.sha256,train:[],val:[]});m.get(r.sha256)[r.relative.split(/[\\/]/)[0]].push(r)}}groups=[...m.values()].filter(g=>g.train.length&&g.val.length).sort((a,b)=>originalId(a.train[0]).localeCompare(originalId(b.train[0])));emptyRows=rows.filter(r=>/[\\/]labels[\\/]/.test(r.relative)&&r.bytes===0).map(r=>{const expected=r.relative.replace(/([\\/])labels([\\/])/,'$1images$2').replace(/\.txt$/,'.jpg');const image=rows.find(x=>x.relative===expected);if(!image)throw Error('Missing empty label image');return image});groups.forEach((g,i)=>{const o=document.createElement('option');o.value=i;o.textContent=String(i+1).padStart(2,'0')+' '+originalId(g.train[0]);document.querySelector('#pair').append(o)});document.querySelector('#sheet1').onclick=()=>show('sheet',0);document.querySelector('#sheet2').onclick=()=>show('sheet',8);document.querySelector('#pair').onchange=e=>show('pair',Number(e.target.value));document.querySelector('#empties').onclick=()=>show('empty');document.querySelector('#boxes').onchange=e=>document.body.classList.toggle('raw',!e.target.checked);document.querySelector('#zoom').onchange=e=>document.body.classList.toggle('zoom',e.target.checked);window.auditShow=show;window.auditItems={groups:groups.map(g=>({hash:g.hash,train:g.train.map(r=>r.relative),val:g.val.map(r=>r.relative)})),empties:emptyRows};await show('sheet',0)}init().catch(e=>{status.textContent='加载失败：'+e.message;console.error(e)})
async function showContext(ids){const rows=await fetch('../data_manifest.json').then(r=>r.json());main.replaceChildren();main.className='context';main.style.gridTemplateColumns='';for(const id of ids){const r=rows.find(r=>/[\\/]images[\\/]/.test(r.relative)&&originalId(r)===id);if(!r)throw Error('Missing context image '+id);main.append(await card(r,(r.relative.startsWith('val')?'空标签本帧':'邻近已标注命名帧')+' '+r.relative.split(/[\\/]/)[0],r.sha256))}await Promise.all([...document.images].map(im=>im.complete?Promise.resolve():new Promise(r=>im.onload=r)));status.textContent='空标签与邻近命名帧视觉对照；只显示原标签，不复制或修正标注';window.scrollTo(0,0);window.auditState={mode:'context',ids};}
for(const [title,ids] of [['空标签00696邻帧',['MVI_40172_img00691','MVI_40172_img00696','MVI_40172_img00701']],['空标签02570邻帧',['MVI_40172_img02566','MVI_40172_img02570','MVI_40172_img02571']]]){const b=document.createElement('button');b.textContent=title;b.onclick=()=>showContext(ids).catch(e=>status.textContent=e.message);document.querySelector('header').insertBefore(b,status)}
window.auditShowContext=showContext;
</script></body></html>
