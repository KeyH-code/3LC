<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OOF ≥0.85 候选核查</title>
<style>
*{box-sizing:border-box}body{font:14px/1.5 system-ui,"Microsoft YaHei",sans-serif;margin:0;color:#182533;background:#f3f4f6}header,main,footer{max-width:1320px;margin:auto;padding:14px}h1{font-size:23px;margin:0 0 8px}p{margin:6px 0}button,select,input{font:inherit;padding:6px;border:1px solid #a6b2c0;border-radius:4px;background:white}button{cursor:pointer}button:hover{background:#e8f0fc}.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.muted{color:#526174}.warn{background:#fff1cc;padding:8px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding-top:0}article{background:white;border:1px solid #d0d8e2;border-radius:5px;padding:10px;min-width:0}h2{font-size:17px;margin:0}.metadata{font-size:12px;overflow-wrap:anywhere}.status{font-weight:600;color:#204f85}.imageButton{border:0;padding:0;width:100%;display:block;background:#eee}.imageButton canvas{width:100%;display:block}.hint{font-size:12px;color:#526174}details{font-size:13px}summary{cursor:pointer;color:#345b89}.whole{width:100%;display:block}dialog{max-width:96vw;width:920px;max-height:96vh;border:1px solid #8799af;border-radius:6px;padding:12px}dialog::backdrop{background:#000a}.dialoghead{display:flex;justify-content:space-between;align-items:center;gap:12px}#zoomCanvas{display:block;max-width:100%;max-height:72vh;width:auto;height:auto;margin:10px auto}.failed{color:#a21c1c}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #4477c1;outline-offset:2px}#search{width:175px}#count{font-weight:600}@media(max-width:760px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:480px){.grid{grid-template-columns:minmax(0,1fr)}}
</style></head><body>
<header><h1>OOF ≥0.85：744 条候选核查</h1><p>蓝虚线 GT＝原始标签；黄框 CHECK＝当前选中预测。模型置信度不是标签错误概率。</p><p class="warn">这是审核工作索引，不是已全部审核或已清洗的数据集。汇总后必须先报告修改规模，未经第二次确认不应用标签。</p><p class="muted">可按状态/场景筛选。每条候选独立显示，点图放大，可切换原框整图、目标局部、无框原图。页面只读，不写标签、不上传内容。</p>
<div class="toolbar"><label>状态 <select id="state"><option value="all">全部</option><option value="unreviewed">尚未审核</option><option value="add_box">补框（含待定边界）</option><option value="change_class">改类建议</option><option value="keep">保持原样</option><option value="defer">不确定</option><option value="blocked">图像不可用</option></select></label><label>类型 <select id="signal"><option value="all">全部</option><option value="prediction_without_label_coverage">无原框充分覆盖</option><option value="class_disagreement">类别冲突</option></select></label><input id="search" aria-label="场景或候选编号搜索" placeholder="场景 / 候选编号"><button id="prev">上一页</button><span id="page"></span><button id="next">下一页</button><span id="count"></span></div></header>
<main id="grid" class="grid"></main><footer><p class="muted">加载/解码成功仅表示文件可用，不代表Agent已目视审核。原有人审结论按具体目标继承，未审新候选不自动沿用邻帧意见。</p></footer>
<dialog id="zoom"><div class="dialoghead"><strong id="zoomTitle"></strong><button id="close">关闭 ×</button></div><div class="toolbar"><button id="whole">整图＋原框</button><button id="focus">选中目标局部</button><button id="raw">无框原图</button></div><p class="hint">局部只是放大原图，不是裁剪推理；不能从放大恢复原图中没有的细节。</p><canvas id="zoomCanvas" width="640" height="640" aria-label="放大核查图"></canvas><p id="zoomError" role="status"></p></dialog>
<script>
'use strict';
const data=__DATA__;
const candidates=data.candidates, reviews=new Map(data.reviews.map(r=>[r.key,r]));
const statusText={unreviewed:'尚未视觉审核',blocked:'图像不可用／未完成',defer:'不确定，暂不修改',keep:'保持原样',add_box:'建议补框',change_class:'建议改类'};
const names=['truck','car','van','bus'];
const pageSize=24;let page=0,filtered=candidates,current=null,mode='whole';
const cache=new Map();
function node(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e;}
function imageFor(c){if(!cache.has(c.id)){const p=new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>{if(im.naturalWidth!==640||im.naturalHeight!==640)reject(Error('原图尺寸异常'));else resolve(im);};im.onerror=()=>reject(Error('原图加载失败'));im.src=c.image_url;});cache.set(c.id,p);}return cache.get(c.id);}
function paintFull(ctx,im,c,raw=false){ctx.clearRect(0,0,640,640);ctx.drawImage(im,0,0,640,640);if(raw)return;ctx.font='13px sans-serif';ctx.lineWidth=2;ctx.setLineDash([6,4]);for(const [i,g] of c.gt_boxes.entries()){const [x1,y1,x2,y2]=g.xyxy;ctx.strokeStyle='#2389ff';ctx.strokeRect(x1,y1,x2-x1,y2-y1);const text=`GT${i} ${names[g.class]}`;ctx.fillStyle='#073b70';ctx.fillRect(x1,Math.max(0,y1-15),ctx.measureText(text).width+3,15);ctx.fillStyle='white';ctx.fillText(text,x1,Math.max(12,y1-3));}ctx.setLineDash([]);ctx.lineWidth=4;ctx.strokeStyle='#ffe000';const [x1,y1,x2,y2]=c.xyxy;ctx.strokeRect(x1,y1,x2-x1,y2-y1);const text=`CHECK ${c.predicted_name} ${c.confidence.toFixed(3)}`;const width=ctx.measureText(text).width+4;const x=Math.max(0,Math.min(x1,640-width)),y=Math.min(625,Math.max(0,y2+2));ctx.fillStyle='#262100';ctx.fillRect(x,y,width,15);ctx.fillStyle='#ffe000';ctx.fillText(text,x+2,y+12);}
async function drawCard(canvas,c){try{const im=await imageFor(c);paintFull(canvas.getContext('2d'),im,c);canvas.dataset.decoded='true';}catch(e){canvas.dataset.decoded='false';const error=node('p','原图不可用：'+e.message,'failed');canvas.parentNode.after(error);}}
function render(){const grid=document.querySelector('#grid');grid.replaceChildren();const max=Math.max(1,Math.ceil(filtered.length/pageSize));page=Math.max(0,Math.min(page,max-1));for(const c of filtered.slice(page*pageSize,(page+1)*pageSize)){const r=reviews.get(c.key);const a=node('article');a.dataset.key=c.key;a.id='candidate-'+c.number;a.append(node('h2',`候选 ${c.number} · ${c.scene}/${c.frame}`));a.append(node('p',statusText[r.decision]+(r.decision==='add_box'&&!r.geometry_ready?'（边界待定稿）':''),'status'));const description=c.signal==='class_disagreement'?`原标 ${c.original_name} → 模型 ${c.predicted_name}`:`无原标签充分覆盖 → 模型 ${c.predicted_name}`;a.append(node('p',description+` · 分数 ${c.confidence.toFixed(3)}`));const b=node('button',undefined,'imageButton');b.setAttribute('aria-label',`放大候选${c.number}`);const canvas=node('canvas');canvas.width=canvas.height=640;canvas.setAttribute('aria-label',`候选${c.number}原图叠框`);b.append(canvas);b.onclick=()=>openZoom(c);a.append(b,node('p','点图放大 · 三种查看方式','hint'));const detail=node('details');detail.append(node('summary','审核记录与候选身份'));detail.append(node('p','来源：'+(r.source||'尚无审核结论')));detail.append(node('p','模型：'+(r.review_model||'尚未确认新审核模型')));detail.append(node('p','意见：'+(r.reason||'尚未审核')));detail.append(node('p','所见：'+(r.observation||'尚无实际目视观察记录')));if(r.uncertainty)detail.append(node('p','不确定性：'+r.uncertainty));detail.append(node('p','预测ID：'+c.prediction_id,'metadata'));detail.append(node('p','原框索引：'+(c.gt_index??'无'),'metadata'));detail.append(node('p','候选键：'+c.key,'metadata'));a.append(detail);grid.append(a);drawCard(canvas,c);}document.querySelector('#page').textContent=`${page+1} / ${max}`;document.querySelector('#count').textContent=`筛选 ${filtered.length} / ${candidates.length} 条`;document.querySelector('#prev').disabled=page===0;document.querySelector('#next').disabled=page===max-1;}
function filter(){const state=document.querySelector('#state').value,signal=document.querySelector('#signal').value,q=document.querySelector('#search').value.trim().toLowerCase();filtered=candidates.filter(c=>(state==='all'||reviews.get(c.key).decision===state)&&(signal==='all'||c.signal===signal)&&(!q||c.scene.toLowerCase().includes(q)||String(c.number)===q));page=0;render();}
for(const id of ['state','signal'])document.querySelector('#'+id).onchange=filter;document.querySelector('#search').oninput=filter;document.querySelector('#prev').onclick=()=>{page--;render();};document.querySelector('#next').onclick=()=>{page++;render();};
const dialog=document.querySelector('#zoom');let drawToken=0;
async function drawZoom(){const token=++drawToken,c=current,requestedMode=mode;const error=document.querySelector('#zoomError'),canvas=document.querySelector('#zoomCanvas');canvas.width=canvas.height=640;delete canvas.dataset.key;delete canvas.dataset.mode;canvas.dataset.decoded='false';error.textContent='';try{const im=await imageFor(c);if(token!==drawToken)return;const ctx=canvas.getContext('2d');if(requestedMode==='focus'){const full=document.createElement('canvas');full.width=full.height=640;paintFull(full.getContext('2d'),im,c);const [x1,y1,x2,y2]=c.xyxy,side=Math.min(640,Math.max(160,1.8*Math.max(x2-x1,y2-y1))),left=Math.max(0,Math.min(640-side,(x1+x2-side)/2)),top=Math.max(0,Math.min(640-side,(y1+y2-side)/2));ctx.drawImage(full,left,top,side,side,0,0,640,640);}else paintFull(ctx,im,c,requestedMode==='raw');canvas.dataset.mode=requestedMode;canvas.dataset.key=c.key;canvas.dataset.decoded='true';}catch(e){if(token!==drawToken)return;error.textContent=e.message;}}
function openZoom(c){current=c;mode='whole';document.querySelector('#zoomTitle').textContent=`候选${c.number} · ${c.scene}/${c.frame}`;dialog.showModal();drawZoom();}
for(const id of ['whole','focus','raw'])document.querySelector('#'+id).onclick=()=>{mode=id;drawZoom();};document.querySelector('#close').onclick=()=>{drawToken++;dialog.close();};
render();
</script></body></html>
